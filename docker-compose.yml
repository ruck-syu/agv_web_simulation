services:
  simulation:
    build: .
    image: agv-warehouse:humble
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      ROS_DOMAIN_ID: "72"
    volumes:
      - .:/workspace
    command: ["ros2", "launch", "agv_web_bridge", "agv_fleet.launch.py"]
    stop_grace_period: 15s
  preview:
    profiles: ["preview"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4174:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./config/preview.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - simulation
